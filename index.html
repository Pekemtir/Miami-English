:root{--f-d:'Patrick Hand','Comic Sans MS',cursive,system-ui;--f-b:'Nunito',system-ui,sans-serif;
--bg:#1a0b2e;--bg2:#12071f;--surface:#2b1450;--surface2:#3a1b6a;--ink:#fff3fb;--muted:#c9b5e8;--line:#6b3fa8;
--yel:#ff3ea5;--on-yel:#ffffff;--pink:#ff7ac6;--pink-s:#4a1442;--blue:#2ef2e0;--grn:#2ef2e0;--grn-s:#0d4a58;--red-s:#5a1230;--red:#ff6b8b;--r:16px;--sun:#ff9a3c;--glow:0 0 12px rgba(255,62,165,.55)}
:root[data-theme="light"]{--bg:#fff1f8;--bg2:#ffe1f0;--surface:#ffffff;--surface2:#ffe9f4;--ink:#2a0f45;--muted:#6d4f8a;--line:#e3a8cf;
--yel:#d81b82;--on-yel:#ffffff;--pink:#c2185b;--pink-s:#ffe0ee;--blue:#00838f;--grn:#00796b;--grn-s:#d4f7f2;--red-s:#ffe0e6;--red:#c62843;--sun:#e8710a;--glow:none;color-scheme:light}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-b);
background-image:linear-gradient(180deg,rgba(255,154,60,.0) 0,rgba(255,62,165,.10) 70%,rgba(46,242,224,.10) 100%);background-attachment:fixed;
padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
button,label,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.app{max-width:720px;margin:0 auto;padding-bottom:110px;min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(10px,env(safe-area-inset-top)) 0 10px}
.brand{background:none;border:0;padding:4px 0;font:400 28px/1 var(--f-d);color:var(--yel);display:flex;align-items:center;gap:8px;letter-spacing:.01em}
.brand small{font:700 12px var(--f-b);color:var(--muted);letter-spacing:.08em}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--surface);border:2px dashed var(--line);border-radius:999px;padding:3px 11px;font:700 15px var(--f-b);white-space:nowrap}
.backbtn{display:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800}
body.sub .backbtn{display:inline-flex}body.sub .brand{display:none}
h1{font:400 clamp(32px,8vw,44px)/1.05 var(--f-d);margin:6px 0 4px;color:var(--yel)}
h2{font:400 26px/1.15 var(--f-d);margin:26px 0 10px;color:var(--yel)}h3{font:400 21px var(--f-d);margin:14px 0 6px}
.sub-t,.muted{color:var(--muted)}p{margin:0 0 10px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.ch{border-style:dashed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:12px 20px;font:800 17px var(--f-b);background:var(--yel);color:var(--on-yel);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.sec{background:var(--surface2);color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:7px 13px;font-size:15px;border-radius:11px}.btn.block{display:block;width:100%;text-align:center}
.btn[disabled]{opacity:.45;pointer-events:none}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}.pill{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800}
.pill.on{background:var(--yel);color:var(--on-yel);border-color:var(--yel)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg2);border-top:2px solid var(--line);display:flex;justify-content:center;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;max-width:130px;border:0;background:none;border-radius:12px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;font:800 12px var(--f-b);color:var(--muted)}
.tab span{font-size:21px;line-height:1.2}.tab.on{background:var(--surface);color:var(--yel)}
body.in-session .tabs,body.sub .tabs{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.tile:active{transform:translateY(3px);box-shadow:none}.tile .ic{font-size:28px}.tile .t{font:400 22px var(--f-d)}.tile .s{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--bg2);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--grn);border-radius:9px;transition:width .4s}
.ring{width:80px;height:80px;flex:none}.ring circle{fill:none;stroke-width:9;stroke-linecap:round}.ring .bg{stroke:var(--bg2)}.ring .fg{stroke:var(--yel);transition:stroke-dashoffset .6s}.ring text{font:400 22px var(--f-d);fill:var(--ink)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.lrow .n{font:400 24px var(--f-d);color:var(--yel);min-width:34px}.lrow .ic{font-size:26px}.lrow b{font:400 22px var(--f-d);display:block}.lrow small{color:var(--muted)}
.lrow.done{border-color:var(--grn)}.lrow .ck{color:var(--grn);font-weight:900}
.badges{display:flex;flex-wrap:wrap;gap:8px}.badge{background:var(--surface2);border:2px solid var(--yel);border-radius:12px;padding:6px 10px;font-size:14px}.badge.off{border-color:var(--line);opacity:.5;filter:grayscale(1)}
.mini{border-collapse:collapse;width:100%;margin:8px 0;font-size:16px}.mini th,.mini td{border:1px solid var(--line);padding:6px 9px;text-align:left}.mini th{background:var(--surface2);color:var(--yel);font-weight:800}
.tw{overflow-x:auto;margin:8px 0}
.ex{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.ex:last-child{border:0}.ex b{font:400 21px var(--f-d)}
.spk{border:2px solid var(--line);background:var(--surface2);border-radius:50%;width:38px;height:38px;flex:none;font-size:17px;line-height:1;padding:0}
.blur{filter:blur(6px);cursor:pointer;transition:filter .2s}.blur.on{filter:none}
.tip{background:var(--bg2);border-left:5px solid var(--yel);border-radius:8px;padding:10px 12px;margin:10px 0}
.goal{display:flex;align-items:center;gap:14px}
.qtop{display:flex;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) 0 14px}
.x{border:2px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;font-size:17px;padding:0}
.prog{flex:1;height:14px;background:var(--bg2);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--grn);transition:width .3s}
.combo{font:400 20px var(--f-d);color:var(--yel);min-width:50px;text-align:right}
.qkind{font:800 12px var(--f-b);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.prompt{font:400 clamp(26px,7vw,34px)/1.15 var(--f-d);margin:0 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:13px 15px;font:700 18px/1.3 var(--f-b);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.opt:active{transform:translateY(2px)}.opt.good{border-color:var(--grn);background:var(--grn-s)}.opt.bad{border-color:var(--red);background:var(--red-s)}
.typebox{width:100%;font:400 26px var(--f-d);padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.typebox.good{border-color:var(--grn);background:var(--grn-s)}.typebox.bad{border-color:var(--red);background:var(--red-s)}
.fld{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;font:600 17px var(--f-b)}
textarea.fld{font-size:13px;min-height:90px;word-break:break-all}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:14px max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));border-top:3px solid;max-height:62vh;overflow:auto;animation:up .2s}
.sheet.good{background:var(--grn-s);border-color:var(--grn)}.sheet.bad{background:var(--red-s);border-color:var(--red)}
.sheet .in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}.sheet h3{margin:0;font-size:26px}
.sheet.good h3{color:var(--grn)}.sheet.bad h3{color:var(--red)}.sheet p{margin:0}.sheet small{color:var(--muted)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.spacer{height:200px}

/* ===== CURSO B1: 18 lecciones (gramática, funciones y léxico). Preguntas: c=opción, t=escribir, b=ordenar ===== */
const B1=[
{id:'b01',n:'Present perfect',es:'Experiencias y cosas que siguen siendo ciertas',ic:'🧭',min:12,mcer:'Aspecto perfectivo · tiempo (duración, anterioridad)',
 goals:['Hablar de experiencias («he estado en…»)','Decir desde cuándo o cuánto tiempo (for / since)','Usar just, already, yet y ever'],
 st:[{t:'Cómo se forma',h:'<p><b>have / has + participio</b>. Sirve para experiencias, resultados presentes y tiempo que llega hasta hoy.</p><table class="mini"><tr><th>I / you / we / they</th><td>have worked</td></tr><tr><th>he / she / it</th><td>has worked</td></tr></table><p>Irregulares útiles: be→<b>been</b>, go→<b>gone/been</b>, see→<b>seen</b>, eat→<b>eaten</b>, do→<b>done</b>, take→<b>taken</b>, write→<b>written</b>, buy→<b>bought</b>, drive→<b>driven</b>.</p><p><b>for</b> + cantidad de tiempo (for five years), <b>since</b> + punto de inicio (since 2019).</p>',ex:[["I have been to New York twice.","He estado en Nueva York dos veces."],["She has just arrived.","Acaba de llegar."],["We haven't eaten yet.","Todavía no hemos comido."],["How long have you lived here?","¿Cuánto tiempo llevas viviendo aquí?"]]}],
 q:[['c',"I ___ visited Miami twice.","have",["has","did","am"],"I + have + participio."],
 ['c',"She ___ lived here since 2020.","has",["have","is","did"],"She + has."],
 ['c',"Have you ___ been to Orlando?","ever",["yet","already","since"],"«Ever» se usa en preguntas de experiencia."],
 ['c',"We haven't seen the show ___.","yet",["ever","since","just"],"«Yet» va al final de negaciones y preguntas."],
 ['c',"They have worked here ___ five years.","for",["since","during","from"],"«For» + duración."],
 ['c',"He has lived here ___ 2019.","since",["for","during","ago"],"«Since» + punto de inicio."],
 ['t',"He has just ___ (arrive) at the hotel.","arrived","Participio regular: arrived."],
 ['t',"I have ___ (see) that film three times.","seen","Participio de see: seen."],
 ['b',"¿Has comido ya?","Have you eaten yet?"]]},
{id:'b02',n:'Tiempos de pasado',es:'Narrar: past simple, past continuous y contraste con present perfect',ic:'📖',min:12,mcer:'Narración de acontecimientos pasados',
 goals:['Contar qué pasó y qué estaba pasando','Combinar when y while','Elegir entre past simple y present perfect'],
 st:[{t:'Qué tiempo uso',h:'<p><b>Past simple</b>: acción terminada en un momento del pasado (yesterday, in 2019, ago).</p><p><b>Past continuous</b> (was/were + -ing): lo que estaba en marcha, el «fondo» de la historia.</p><p>Una acción larga se interrumpe por una corta: <b>I was walking</b> when it <b>started</b> to rain.</p><p><b>While</b> + acción larga; <b>when</b> + acción corta.</p><p>Con tiempo terminado → past simple (<i>I lost my wallet yesterday</i>). Con resultado actual → present perfect (<i>I have lost my wallet</i>).</p>',ex:[["I was walking on the beach when it started to rain.","Paseaba por la playa cuando empezó a llover."],["While we were eating, my phone rang.","Mientras comíamos, sonó mi móvil."],["I lost my wallet yesterday.","Perdí la cartera ayer."],["I have lost my wallet.","He perdido la cartera (y no la tengo)."]]}],
 q:[['c',"I ___ my keys yesterday.","lost",["have lost","was losing","lose"],"Yesterday es tiempo terminado: past simple."],
 ['c',"She ___ TV when I called.","was watching",["watched","has watched","watches"],"Acción en marcha interrumpida."],
 ['c',"While they ___, it started to rain.","were walking",["walked","have walked","are walking"],"While + past continuous."],
 ['c',"We ___ to Miami in 2022.","went",["have gone","were going","go"],"Con una fecha concreta, past simple."],
 ['c',"I ___ dinner when the lights went out.","was cooking",["cooked","have cooked","cook"],"Acción en marcha."],
 ['c',"I have lived here ___ 2020.","since",["in","ago","during"],"Present perfect + since."],
 ['t',"Last night I ___ (go) to bed late.","went","Go es irregular: went."],
 ['t',"He ___ (sleep) when the phone rang.","was sleeping","Past continuous: was sleeping."],
 ['b',"Estaba lloviendo cuando llegamos.","It was raining when we arrived."]]},
{id:'b03',n:'Used to y costumbres',es:'Hábitos del pasado y acostumbrarse',ic:'⏳',min:10,mcer:'Aspecto habitual · contraste pasado/presente',
 goals:['Hablar de hábitos y situaciones que ya no son ciertos','Distinguir used to de be used to','Decir que te cuesta o te acostumbras a algo'],
 st:[{t:'Used to y be used to',h:'<p><b>used to + infinitivo</b>: hábito o estado del pasado que ya no existe. Negativa: <i>didn\'t use to</i>. Pregunta: <i>Did you use to…?</i></p><p><b>be used to + -ing</b>: estar acostumbrado/a. <b>get used to + -ing</b>: acostumbrarse.</p><table class="mini"><tr><th>I used to live in Madrid.</th><td>Antes vivía allí (ya no).</td></tr><tr><th>I\'m used to living here.</th><td>Ya estoy acostumbrado/a.</td></tr></table>',ex:[["I used to play football every weekend.","Antes jugaba al fútbol cada fin de semana."],["We didn't use to have a car.","Antes no teníamos coche."],["I'm not used to getting up so early.","No estoy acostumbrado/a a madrugar tanto."],["You'll soon get used to the heat.","Pronto te acostumbrarás al calor."]]}],
 q:[['c',"I ___ play football every weekend when I was a kid.","used to",["use to","was used to","am used to"],"Hábito pasado: used to + infinitivo."],
 ['c',"She ___ live in Madrid, but now she lives in Miami.","used to",["is used to","uses to","would to"],"Estado pasado que ya no es cierto."],
 ['c',"Did you ___ smoke?","use to",["used to","using to","used"],"En preguntas con did, «use to»."],
 ['c',"I'm not used to ___ so early.","getting up",["get up","got up","to get up"],"be used to + -ing."],
 ['c',"You will soon get used to ___ in Miami.","living",["live","lived","to live"],"get used to + -ing."],
 ['t',"We ___ (not / use) to have a car.","didn't use|did not use","Negativa: didn't use to."],
 ['t',"I used to ___ (go) to the beach every summer.","go","Used to + infinitivo."],
 ['b',"Antes vivía en Madrid.","I used to live in Madrid."]]},
{id:'b04',n:'Futuro y planes',es:'Will, going to, presente continuo y posibilidad',ic:'🔮',min:12,mcer:'Aspecto prospectivo · intención, predicción, promesa',
 goals:['Decidir sobre la marcha, prometer y ofrecer (will)','Hablar de planes y pruebas (going to)','Hablar de citas ya fijadas y de posibilidades (might)'],
 st:[{t:'Cuatro formas de futuro',h:'<table class="mini"><tr><th>will</th><td>decisión al hablar, promesa, oferta, predicción: <i>I\'ll help you.</i></td></tr><tr><th>be going to</th><td>plan o intención; pruebas: <i>Look at those clouds! It\'s going to rain.</i></td></tr><tr><th>presente continuo</th><td>cita ya organizada: <i>We\'re having dinner at eight.</i></td></tr><tr><th>may / might</th><td>posibilidad: <i>It might rain later.</i></td></tr></table>',ex:[["I'll carry your bag.","Te llevo la bolsa."],["I'm going to visit Little Havana next week.","Voy a visitar Little Havana la semana que viene."],["We're meeting at the hotel at six.","Quedamos en el hotel a las seis."],["It might rain, so take an umbrella.","Puede que llueva, así que lleva paraguas."]]}],
 q:[['c',"Look at those clouds! It ___ rain.","is going to",["will to","is going","goes to"],"Hay pruebas: be going to."],
 ['c',"A: I'm cold. B: I ___ close the window.","will",["am going to","would","go to"],"Decisión en el momento: will."],
 ['c',"We ___ dinner with Mark tonight. It's arranged.","are having",["will have","have","are going have"],"Cita ya organizada: presente continuo."],
 ['c',"It ___ rain later, so take an umbrella.","might",["might to","is might","mights"],"Posibilidad: might + infinitivo."],
 ['c',"I ___ to visit Key West next month. It's my plan.","am going",["will","go","am go"],"Plan: be going to."],
 ['t',"I promise I ___ (call) you tomorrow.","will call|'ll call","Promesa: will."],
 ['t',"She ___ (travel) to Spain next month; she has already bought the ticket.","is traveling|is travelling","Cita fijada: presente continuo."],
 ['b',"Voy a pedir una pizza.","I'm going to order a pizza."]]},
{id:'b05',n:'Condicionales 0 y 1',es:'Si pasa X, pasa Y; when, unless, as soon as',ic:'🌦️',min:10,mcer:'Relaciones lógicas: condición',
 goals:['Hablar de hechos y posibilidades reales con if','Usar when, unless, until y as soon as con el futuro','Dar condiciones y advertencias'],
 st:[{t:'If real',h:'<p><b>Zero</b>: hechos generales. <i>If you heat ice, it melts.</i> (if + presente, presente)</p><p><b>First</b>: posibilidad real en el futuro. <i>If it rains, we\'ll stay in.</i> (if + presente, will + infinitivo)</p><p>Después de if, when, unless, until y as soon as se usa el <b>presente</b>, no will.</p><p><b>unless</b> = if … not: <i>You\'ll be late unless you hurry.</i></p>',ex:[["If it rains, we'll stay at the hotel.","Si llueve, nos quedaremos en el hotel."],["I'll call you when I arrive.","Te llamaré cuando llegue."],["You'll be late unless you hurry.","Llegarás tarde a menos que te des prisa."],["As soon as we get there, we'll eat.","En cuanto lleguemos, comeremos."]]}],
 q:[['c',"If it ___, we'll stay at the hotel.","rains",["will rain","rained","is raining"],"If + presente."],
 ['c',"If you ___ the bus, you'll be late.","miss",["will miss","missed","missing"],"If + presente."],
 ['c',"If you heat ice, it ___.","melts",["will melted","melted","melting"],"Hecho general: presente."],
 ['c',"I'll call you when I ___ at the airport.","arrive",["will arrive","arrived","arriving"],"When + presente."],
 ['c',"You'll be late ___ you hurry.","unless",["until","when","because"],"Unless = a menos que."],
 ['t',"If I ___ (have) time, I'll visit the museum.","have","If + presente."],
 ['t',"As soon as we ___ (get) to the hotel, we'll call you.","get","As soon as + presente."],
 ['b',"Si llueve, nos quedaremos en casa.","If it rains, we will stay at home."]]},
{id:'b06',n:'Condicional 2 y deseos',es:'Hipótesis, consejos con «If I were you» e «I wish»',ic:'💭',min:12,mcer:'Hipótesis · deseo · conjetura',
 goals:['Hablar de situaciones imaginarias','Dar consejos con If I were you','Expresar deseos con I wish'],
 st:[{t:'Si fuera…',h:'<p><b>if + pasado simple, would + infinitivo</b>. Habla de algo improbable o imaginario: <i>If I won the lottery, I would buy a house.</i></p><p>Con <b>be</b> se usa <b>were</b> para todas las personas: <i>If I were you, I\'d take a taxi.</i></p><p><b>I wish + pasado</b>: deseo sobre el presente: <i>I wish I lived near the beach.</i> <b>I wish I could…</b>: quisiera poder.</p>',ex:[["If I had more money, I would travel more.","Si tuviera más dinero, viajaría más."],["If I were you, I would take a taxi.","Yo en tu lugar, cogería un taxi."],["What would you do if you lost your passport?","¿Qué harías si perdieras el pasaporte?"],["I wish I could speak better English.","Ojalá pudiera hablar mejor inglés."]]}],
 q:[['c',"If I ___ more money, I would travel more.","had",["have","would have","will have"],"If + pasado simple."],
 ['c',"If she ___ here, she would help us.","were",["is","would be","be"],"Con be en condicional 2, were."],
 ['c',"What ___ you do if you lost your passport?","would",["will","did","do"],"Would + infinitivo."],
 ['c',"I wish I ___ speak better English.","could",["can","will","would"],"I wish + pasado (could)."],
 ['c',"If I ___ you, I would take a taxi.","were",["am","would be","be"],"If I were you = yo en tu lugar."],
 ['t',"If I won the lottery, I ___ (buy) a house in Miami.","would buy|'d buy","Would + infinitivo."],
 ['t',"I wish I ___ (live) near the beach.","lived","I wish + pasado simple."],
 ['b',"Si tuviera tiempo, iría contigo.","If I had time, I would go with you."]]},
{id:'b07',n:'Obligación, permiso y prohibición',es:'Must, have to, mustn\'t, don\'t have to, can, may, could',ic:'🚦',min:12,mcer:'Modalidad: obligación, permiso, prohibición, necesidad',
 goals:['Decir lo que es obligatorio o no hace falta','Distinguir mustn\'t de don\'t have to','Pedir y dar permiso con cortesía'],
 st:[{t:'Modales de norma',h:'<table class="mini"><tr><th>must / have to</th><td>es obligatorio</td></tr><tr><th>mustn\'t</th><td>está prohibido</td></tr><tr><th>don\'t have to</th><td>no hace falta (pero se puede)</td></tr><tr><th>can / may / could</th><td>permiso; <i>Could I…?</i> y <i>May I…?</i> son más educados</td></tr></table><p>Cuidado: <b>mustn\'t</b> y <b>don\'t have to</b> NO significan lo mismo.</p>',ex:[["You must show your passport at immigration.","Debes enseñar el pasaporte en migración."],["You mustn't smoke here.","No puedes fumar aquí (prohibido)."],["You don't have to pay now.","No hace falta pagar ahora."],["Could I use your phone, please?","¿Podría usar su teléfono, por favor?"]]}],
 q:[['c',"You ___ wear a seat belt in the car. It's the law.","must",["might","can","don't have to"],"Obligación legal: must."],
 ['c',"You ___ smoke here. It's forbidden.","mustn't",["don't have to","might not","may to"],"Prohibición: mustn't."],
 ['c',"You ___ pay now. You can pay later.","don't have to",["mustn't","can't","shouldn't"],"No es necesario: don't have to."],
 ['c',"___ I use your phone, please?","Could",["Must","Would to","Do"],"Permiso educado: Could I…?"],
 ['c',"Visitors ___ take photos inside the museum. It's allowed.","can",["mustn't","have to","must not"],"Permitido: can."],
 ['t',"You ___ (not / have) to wear a tie. It's casual.","don't have to|do not have to","No es necesario."],
 ['t',"Passengers ___ (must / not) use phones during take-off.","must not|mustn't","Prohibición."],
 ['b',"¿Puedo sentarme aquí?","Can I sit here?"]]},
{id:'b08',n:'Consejos, sugerencias y deducción',es:'Should, had better, Why don\'t we, must / might / can\'t be',ic:'💡',min:12,mcer:'Consejos · sugerencias · conjetura',
 goals:['Aconsejar y sugerir','Deducir cosas con must, might y can\'t','Proponer planes con Why don\'t we…?'],
 st:[{t:'Aconsejar y deducir',h:'<table class="mini"><tr><th>should / ought to</th><td>consejo: <i>You should rest.</i></td></tr><tr><th>had better</th><td>consejo fuerte: <i>You\'d better hurry.</i></td></tr><tr><th>Why don\'t we…?</th><td>sugerencia: <i>Why don\'t we try that café?</i></td></tr><tr><th>must be</th><td>seguro que sí</td></tr><tr><th>might be</th><td>quizá</td></tr><tr><th>can\'t be</th><td>seguro que no</td></tr></table>',ex:[["You look tired. You should go to bed early.","Pareces cansado/a. Deberías acostarte pronto."],["Why don't we try the new restaurant?","¿Por qué no probamos el restaurante nuevo?"],["She must be at home. Her car is outside.","Seguro que está en casa. Su coche está fuera."],["He can't be the manager. He's too young.","No puede ser el jefe. Es muy joven."]]}],
 q:[['c',"You look tired. You ___ go to bed early.","should",["must to","would to","can to"],"Consejo: should."],
 ['c',"Why ___ we try the new restaurant?","don't",["not","aren't","won't"],"Why don't we…?"],
 ['c',"She ___ be at home. Her car is outside.","must",["can't","might not","shouldn't"],"Deducción segura: must be."],
 ['c',"He ___ be the manager. He's too young.","can't",["must","might","should"],"Seguro que no: can't be."],
 ['c',"I'm not sure, but it ___ rain later.","might",["must","can't","would"],"Posibilidad: might."],
 ['c',"You ___ better take an umbrella.","had",["have","would","should"],"You had better = más te vale."],
 ['t',"If I were you, I ___ (take) a taxi.","would take|'d take","Consejo con would."],
 ['b',"Deberías probar el café cubano.","You should try the Cuban coffee."]]},
{id:'b09',n:'La voz pasiva',es:'Presente y pasado simple en pasiva',ic:'🔄',min:10,mcer:'Estados, procesos y focalización',
 goals:['Entender y formar la pasiva simple','Hablar de lo que se hace o se hizo sin decir quién','Contar un robo o una pérdida'],
 st:[{t:'Be + participio',h:'<p>Se usa cuando importa más <b>lo que pasa</b> que <b>quién lo hace</b>.</p><table class="mini"><tr><th>Presente</th><td>am / is / are + participio: <i>English is spoken here.</i></td></tr><tr><th>Pasado</th><td>was / were + participio: <i>My wallet was stolen.</i></td></tr></table><p>Si quieres decir quién: <b>by</b> + agente.</p>',ex:[["English is spoken in many countries.","Se habla inglés en muchos países."],["The hotel was built in 1998.","El hotel se construyó en 1998."],["My wallet was stolen yesterday.","Me robaron la cartera ayer."],["These rooms are cleaned every morning.","Estas habitaciones se limpian cada mañana."]]}],
 q:[['c',"English ___ in many countries.","is spoken",["speaks","is speaking","spoken"],"Presente pasivo."],
 ['c',"The hotel ___ in 1998.","was built",["built","is built","has build"],"Pasado pasivo."],
 ['c',"My wallet ___ yesterday.","was stolen",["stolen","was stole","is stolen"],"Participio de steal: stolen."],
 ['c',"Lunch ___ at one o'clock every day.","is served",["serves","is serve","served"],"Presente pasivo."],
 ['c',"These rooms ___ every morning.","are cleaned",["cleaned","are cleaning","is cleaned"],"Plural: are."],
 ['t',"The tickets ___ (sell) out last week.","were sold","Pasivo pasado plural."],
 ['t',"Spanish ___ (speak) in Miami.","is spoken","Presente pasivo."],
 ['b',"Mi maleta fue encontrada.","My suitcase was found."]]},
{id:'b10',n:'Estilo indirecto',es:'Contar lo que dijo o preguntó otra persona',ic:'🗣️',min:12,mcer:'Informar · transmitir mensajes',
 goals:['Transmitir lo que dijo alguien','Transmitir preguntas y órdenes','Ajustar tiempos, pronombres y lugares'],
 st:[{t:'Un paso atrás',h:'<p>Al contar lo que dijo alguien, el verbo suele «retroceder» un tiempo.</p><table class="mini"><tr><th>am / is</th><td>was</td></tr><tr><th>live / lives</th><td>lived</td></tr><tr><th>will</th><td>would</td></tr><tr><th>have finished</th><td>had finished</td></tr></table><p>Preguntas: <b>asked + if / wh-</b> + orden afirmativo: <i>She asked where I lived.</i></p><p>Órdenes: <b>told + persona + to + infinitivo</b>.</p>',ex:[["She said that she was tired.","Dijo que estaba cansada."],["He said he lived in Miami.","Dijo que vivía en Miami."],["She asked me where I lived.","Me preguntó dónde vivía."],["She told me to open the window.","Me dijo que abriera la ventana."]]}],
 q:[['c',"«I am tired.» → She said that she ___ tired.","was",["is","will be","has been"],"am/is pasa a was."],
 ['c',"«I live in Miami.» → He said he ___ in Miami.","lived",["lives","live","is living"],"Presente pasa a pasado."],
 ['c',"«Where do you live?» → She asked me where I ___.","lived",["did I live","do I live","am living"],"Orden afirmativo y pasado."],
 ['c',"«I will call you.» → He said he ___ call me.","would",["will","is going","did"],"will pasa a would."],
 ['c',"«Open the window,» she told me. → She told me ___ the window.","to open",["open","opening","that open"],"Told + persona + to."],
 ['c',"I asked him ___ he spoke English.","if",["that","what","do"],"Pregunta sí/no: if."],
 ['t',"«I have finished.» → He said he ___ finished.","had","have pasa a had."],
 ['b',"Dijo que estaba cansada.","She said that she was tired."]]},
{id:'b11',n:'Oraciones de relativo',es:'Who, which, that, where, whose',ic:'🧩',min:10,mcer:'Cualidad · describir con más detalle',
 goals:['Añadir información con who, which, that','Usar where y whose','Distinguir relativos con y sin comas'],
 st:[{t:'Quién, qué, dónde, de quién',h:'<table class="mini"><tr><th>who / that</th><td>personas</td></tr><tr><th>which / that</th><td>cosas</td></tr><tr><th>where</th><td>lugares</td></tr><tr><th>whose</th><td>posesión (de quien)</td></tr></table><p>Con información extra se usan comas y <b>no</b> se usa that: <i>Miami, which is in Florida, is warm.</i></p>',ex:[["The man who helped me was very kind.","El hombre que me ayudó fue muy amable."],["This is the restaurant where we had dinner.","Este es el restaurante donde cenamos."],["She's the woman whose car was stolen.","Es la mujer a la que le robaron el coche."],["Miami, which is in Florida, is very warm.","Miami, que está en Florida, es muy cálida."]]}],
 q:[['c',"The man ___ helped me was very kind.","who",["which","whose","where"],"Persona: who."],
 ['c',"This is the restaurant ___ we had dinner.","where",["who","which are","whose"],"Lugar: where."],
 ['c',"I lost the bag ___ I bought yesterday.","that",["who","whose","where"],"Cosa: that o which."],
 ['c',"She's the woman ___ car was stolen.","whose",["who","which","that"],"Posesión: whose."],
 ['c',"Miami, ___ is in Florida, is very warm.","which",["that","who","where"],"Con comas no se usa that."],
 ['t',"A pharmacy is a place ___ you buy medicine.","where","Lugar: where."],
 ['t',"The tourists ___ arrived late missed the tour.","who|that","Personas: who o that."],
 ['b',"Este es el hotel donde nos alojamos.","This is the hotel where we stayed."]]},
{id:'b12',n:'Gerundio e infinitivo',es:'Qué verbos llevan -ing, cuáles to y la finalidad',ic:'🔁',min:10,mcer:'Finalidad · patrones verbales',
 goals:['Elegir -ing o to + infinitivo tras el verbo','Expresar finalidad con to / in order to','Usar -ing tras preposiciones'],
 st:[{t:'Patrones habituales',h:'<table class="mini"><tr><th>+ -ing</th><td>enjoy, finish, avoid, mind, keep, suggest; después de preposición (good at, look forward to)</td></tr><tr><th>+ to + infinitivo</th><td>want, decide, hope, plan, need, learn, promise</td></tr><tr><th>finalidad</th><td>I went to the bank <b>to get</b> money.</td></tr></table>',ex:[["I enjoy walking on the beach.","Disfruto paseando por la playa."],["We decided to take a taxi.","Decidimos coger un taxi."],["She's good at learning languages.","Se le dan bien los idiomas."],["I'm looking forward to seeing you.","Tengo ganas de verte."]]}],
 q:[['c',"I enjoy ___ on the beach.","walking",["to walk","walk","walked"],"Enjoy + -ing."],
 ['c',"We decided ___ a taxi.","to take",["taking","take","took"],"Decide + to."],
 ['c',"She's good at ___ languages.","learning",["to learn","learn","learned"],"Preposición + -ing."],
 ['c',"I went to the bank ___ money.","to get",["for get","getting","for to get"],"Finalidad: to + infinitivo."],
 ['c',"He stopped ___ when he saw the sign.","walking",["to walk","walk","walked"],"Dejó de caminar: stop + -ing."],
 ['c',"I'm looking forward to ___ you.","seeing",["see","to see","saw"],"Look forward to + -ing."],
 ['t',"I want ___ (visit) Key West.","to visit","Want + to."],
 ['b',"Disfruto nadando en el mar.","I enjoy swimming in the sea."]]},
{id:'b13',n:'Comparar y graduar',es:'Comparativos, superlativos, too, enough, so y such',ic:'📏',min:10,mcer:'Cantidad (grado) · comparación · resultado',
 goals:['Comparar personas, lugares y precios','Decir que algo es demasiado o suficiente','Usar so … that y such … that'],
 st:[{t:'Grado y comparación',h:'<table class="mini"><tr><th>corto</th><td>warm → warmer → the warmest</td></tr><tr><th>largo</th><td>expensive → more expensive → the most expensive</td></tr><tr><th>irregular</th><td>good → better → the best; bad → worse → the worst</td></tr><tr><th>igualdad</th><td>as … as / not as … as</td></tr><tr><th>too / enough</th><td>too hot (demasiado) · big enough (lo bastante)</td></tr><tr><th>so / such</th><td>so hot that… · such a hot day that…</td></tr></table>',ex:[["Miami is warmer than Madrid in winter.","Miami es más cálida que Madrid en invierno."],["It's too hot to walk outside.","Hace demasiado calor para caminar fuera."],["The room is big enough for four people.","La habitación es lo bastante grande para cuatro."],["It was such a hot day that we stayed inside.","Fue un día tan caluroso que nos quedamos dentro."]]}],
 q:[['c',"Miami is ___ than Madrid in winter.","warmer",["more warm","warm","the warmest"],"Adjetivo corto: -er than."],
 ['c',"This is the ___ hotel in the city.","most expensive",["more expensive","expensivest","most expensiver"],"Superlativo largo: the most."],
 ['c',"The beach isn't as crowded ___ it was yesterday.","as",["than","that","like"],"not as … as."],
 ['c',"It's ___ hot to walk outside.","too",["enough","so","very much"],"Demasiado: too."],
 ['c',"The room is big ___ for four people.","enough",["too","so","very"],"Adjetivo + enough."],
 ['c',"It was ___ a hot day that we stayed inside.","such",["so","too","very"],"such + a + adjetivo + sustantivo."],
 ['t',"She speaks English ___ (good) than me.","better","Good → better."],
 ['b',"Este es el mejor restaurante.","This is the best restaurant."]]},
{id:'b14',n:'Cantidad y contables',es:'Much, many, a lot of, few, little, some, any',ic:'🧮',min:10,mcer:'Cantidad (número, cantidad y grado)',
 goals:['Distinguir contables e incontables','Preguntar por cantidades con how much / how many','Usar some y any'],

{id:'b15',n:'Conectores',es:'Because, so, although, despite, however, therefore, while',ic:'🔗',min:12,mcer:'Relaciones lógicas: causa, resultado, concesión, contraste',
 goals:['Explicar causa y resultado','Expresar contraste y concesión','Enlazar ideas en un texto o conversación'],
 st:[{t:'Unir ideas',h:'<table class="mini"><tr><th>causa</th><td>because, since, as</td></tr><tr><th>resultado</th><td>so, therefore</td></tr><tr><th>concesión</th><td>although, even though, despite / in spite of (+ nombre o -ing)</td></tr><tr><th>contraste</th><td>but, however, while, whereas</td></tr></table><p><b>Although</b> + frase completa. <b>Despite</b> + nombre/-ing: <i>Despite the rain…</i></p>',ex:[["We stayed inside because it was raining.","Nos quedamos dentro porque llovía."],["It was cold, so we stayed in.","Hacía frío, así que nos quedamos."],["Although it was cold, we went swimming.","Aunque hacía frío, nos bañamos."],["I like beaches. However, I don't like crowds.","Me gustan las playas. Sin embargo, no me gustan las multitudes."]]}],
 q:[['c',"We stayed inside ___ it was raining.","because",["although","so","however"],"Causa: because."],
 ['c',"It was raining, ___ we stayed inside.","so",["because","although","despite"],"Resultado: so."],
 ['c',"___ it was cold, we went swimming.","Although",["Because","So","Despite of"],"Concesión + frase."],
 ['c',"___ the rain, we enjoyed the day.","Despite",["Although","Because","However"],"Despite + nombre."],
 ['c',"I like beaches. ___, I don't like crowds.","However",["Because","Although","So"],"Contraste entre frases."],
 ['c',"He studied hard; ___, he passed the exam.","therefore",["although","because","however"],"Resultado formal."],

 ['b',"Aunque estaba cansada, salió.","Although she was tired, she went out."]]},
{id:'b16',n:'Preguntas y cortesía',es:'Question tags, preguntas indirectas y peticiones educadas',ic:'❓',min:10,mcer:'Interrogación · cortesía · petición de información',
 goals:['Confirmar con question tags','Preguntar de forma educada e indirecta','Pedir información en transacciones'],
 st:[{t:'Tags y preguntas indirectas',h:'<p><b>Question tag</b>: frase positiva → tag negativo; frase negativa → tag positivo. <i>It\'s nice, isn\'t it? You haven\'t eaten, have you?</i></p><p><b>Pregunta indirecta</b>: sin inversión ni do. <i>Could you tell me where the station is?</i> · <i>Do you know what time it opens?</i></p>',ex:[["It's a nice day, isn't it?","Hace buen día, ¿verdad?"],["You haven't eaten, have you?","No has comido, ¿verdad?"],["Could you tell me where the station is?","¿Podría decirme dónde está la estación?"],["Do you know what time the museum opens?","¿Sabe a qué hora abre el museo?"]]}],
 q:[['c',"It's a nice day, ___?","isn't it",["is it","doesn't it","aren't it"],"Positivo → tag negativo."],
 ['c',"You speak English, ___?","don't you",["aren't you","do you","isn't you"],"Presente simple: don't you."],
 ['c',"You haven't eaten, ___?","have you",["haven't you","did you","are you"],"Negativo → tag positivo."],
 ['c',"Could you tell me where the station ___?","is",["does it","is it","be"],"Orden afirmativo en indirecta."],
 ['c',"Do you know what time the museum ___?","opens",["does open","open it","is opens"],"Sin do en la parte indirecta."],
 ['c',"I'd like to know how much ___.","it costs",["does it cost","cost it","costs it"],"Orden afirmativo: it costs."],
 ['t',"Could you tell me where the restroom ___? (be)","is","Where the restroom is."],
 ['b',"¿Podría decirme dónde está el banco?","Could you tell me where the bank is?"]]},

{id:'g1',n:'Ser/estar y presentarse',es:'I am, you are, he is…',ic:'🙋',min:8,mcer:'A1 · identificación personal',goals:['Presentarte','Preguntar y negar con be'],

 q:[['c',"I ___ from Spain.","am",["is","are","be"],"I + am."],['c',"She ___ my friend.","is",["am","are","be"],"She + is."],['c',"___ you ready?","Are",["Is","Am","Do"],"Are you…?"],['c',"They ___ not here.","are",["is","am","does"],"They + are."],['t',"We ___ (be) on vacation.","are","We + are."],['t',"I ___ not tired. (be)","am","I + am."],['b',"Soy de Pamplona.","I'm from Pamplona."]]},
{id:'g2',n:'Pedir con cortesía',es:'Can I…? Could I…? I\'d like…',ic:'🙏',min:8,mcer:'A1-A2 · petición de bienes y servicios',goals:['Pedir cosas con educación','Ofrecer con Would you like…?'],

{id:'g3',n:'Presente simple',es:'Rutinas, hechos y preguntas con do / does',ic:'🕘',min:10,mcer:'A1-A2 · hábitos y hechos',goals:['Hablar de rutinas','Preguntar y negar con do / does'],
 st:[{t:'Do y does',h:'<p>Afirmativa: he/she/it + <b>-s</b> (she works). Negativa: <b>don\'t / doesn\'t</b> + infinitivo. Pregunta: <b>Do / Does</b> + sujeto + infinitivo.</p><table class="mini"><tr><th>I work</th><td>He works</td></tr><tr><th>I don\'t work</th><td>He doesn\'t work</td></tr><tr><th>Do you work?</th><td>Does he work?</td></tr></table>',ex:[["She lives in Miami.","Vive en Miami."],["Do you speak English?","¿Hablas inglés?"],["What time does the museum open?","¿A qué hora abre el museo?"]]}],
 q:[['c',"She ___ in Miami.","lives",["live","is live","living"],"She + verbo con -s."],['c',"___ you speak English?","Do",["Does","Are","Is"],"Do you…?"],['c',"He ___ not like coffee.","does",["do","is","has"],"He + does not."],['c',"What time ___ the museum open?","does",["do","is","are"],"The museum = it: does."],['t',"My brother ___ (work) in a hotel.","works","He + -s."],['t',"We ___ (not / eat) meat.","don't eat|do not eat","We + don't."],['b',"¿Hablas español?","Do you speak Spanish?"]]},
{id:'g4',n:'Pasado simple',es:'Qué hiciste: verbos regulares e irregulares comunes',ic:'⏮️',min:10,mcer:'A2 · narrar acontecimientos pasados',goals:['Contar lo que hiciste ayer','Preguntar y negar con did'],
 st:[{t:'Regulares e irregulares',h:'<p>Regulares: <b>-ed</b> (visited, arrived). Irregulares: go→<b>went</b>, have→<b>had</b>, see→<b>saw</b>, buy→<b>bought</b>, eat→<b>ate</b>. Negativa y pregunta con <b>did</b> + infinitivo: <i>Did you see it? I didn\'t see it.</i></p>',ex:[["I went to the beach yesterday.","Ayer fui a la playa."],["Did you see the show?","¿Viste el espectáculo?"],["We didn't buy anything.","No compramos nada."]]}],
 q:[['c',"I ___ to the beach yesterday.","went",["go","goed","was go"],"Go → went."],['c',"We ___ a great meal.","had",["have","haved","has"],"Have → had."],['c',"___ you see the show?","Did",["Do","Were","Have"],"Did you…?"],['c',"I didn't ___ the news.","see",["saw","seen","seeing"],"Después de didn't, infinitivo."],['t',"They ___ (arrive) at nine.","arrived","Regular: -ed."],['t',"He ___ (buy) a souvenir.","bought","Buy → bought."],['b',"Ayer visité el museo.","Yesterday I visited the museum."]]},
{id:'g5',n:'Hay, esto y lugares',es:'There is / are, this / that y preposiciones de lugar',ic:'📍',min:8,mcer:'A1-A2 · espacio y relaciones espaciales',goals:['Preguntar si hay algo','Decir dónde está algo'],

{id:'g6',n:'Números, precios y hora',es:'Cifras, dólares y cómo decir la hora',ic:'🔢',min:8,mcer:'A1-A2 · cantidades, precios y tiempo',goals:['Entender precios','Decir y entender la hora'],

function MIN_DONE(){return MINS.every(id=>(S.prog[id]||{}).done)}
const prog=id=>S.prog[id]||(S.prog[id]={learn:false,prac:0,sims:{},drill:0,done:false,sk:{}});
function simsOf(id){return SIMS.filter(s=>s.mod===id)}
function modDone(id){const p=prog(id);return !!(p.learn&&p.prac>=70&&simsOf(id).every(s=>p.sims[s.id]))}
function weeksLeft(){const P=S.prof||{};return Math.max(1,Math.min(16,P.weeks||6))}
function itemDone(it){
  if(it.t==='learn')return !!prog(it.mod).learn;
  if(it.t==='prac')return prog(it.mod).prac>=70;
  if(it.t==='sim')return !!prog(it.mod).sims[it.sim];
  if(it.t==='drill')return prog(it.mod).drill>=70;
  if(it.t==='gr'||it.t==='b1')return !!(S.les&&S.les[it.les]&&S.les[it.les].best>=70);
  if(it.t==='final')return !!S.fin;

function buildPlan(){
  const P=S.prof||{};const lv=LV();const wk=weakFlags();
  const days=P.days||5,mins=P.mins||15,weeks=weeksLeft();
  const budget=weeks*days*mins;const fears=P.fears||[];const goal=P.goal||'tour';
  const items=[];
  const modItems=id=>{const a=[{t:'learn',mod:id,min:5},{t:'prac',mod:id,min:6}];
    simsOf(id).forEach(s=>a.push({t:'sim',mod:id,sim:s.id,min:5}));
    if(wk.oral&&MOD[id].min)a.push({t:'drill',mod:id,min:4});return a};
  const order=MINS.slice().sort((a,b)=>{if(a==='surv')return -1;if(b==='surv')return 1;const fa=fears.indexOf(a)>=0?0:1,fb=fears.indexOf(b)>=0?0:1;return fa-fb||MINS.indexOf(a)-MINS.indexOf(b)});
  const grLessons=()=>{let g=[];if(lv===1)g=['g1','g2','g3','g4','g5','g6'];else if(lv===2&&wk.gram)g=['g3','g4','g5'];else if(wk.gram)g=['g3','g4'];return g};
  const gr=grLessons();let grI=0;
  order.forEach((id,idx)=>{modItems(id).forEach(i=>items.push(i));
    if(gr[grI]&&(idx>=1||lv===1)){const l=GRM[gr[grI++]];items.push({t:'gr',les:l.id,min:l.min})}});
  while(grI<gr.length){const l=GRM[gr[grI++]];items.push({t:'gr',les:l.id,min:l.min})}
  let used=items.reduce((a,i)=>a+i.min,0);
  const reserve=Math.round(budget*.12)+12;
  const extras=MODS.filter(m=>!m.min).map(m=>m.id).sort((a,b)=>{const fa=fears.indexOf(a)>=0?0:1,fb=fears.indexOf(b)>=0?0:1;if(fa!==fb)return fa-fb;return (GOAL_EXTRAS[goal]||[]).indexOf(a)-(GOAL_EXTRAS[goal]||[]).indexOf(b)});
  extras.forEach(id=>{const its=modItems(id);const cost=its.reduce((a,i)=>a+i.min,0);if(used+cost<=budget-reserve){its.forEach(i=>items.push(i));used+=cost}});
  /* lecciones del curso B1 si hay hueco (nivel A2 en adelante) */
  if(lv>=2){const cap=lv===3?B1.length:4;let c=0;B1.forEach(l=>{if(c<cap&&used+l.min<=budget-reserve){items.push({t:'b1',les:l.id,min:l.min});used+=l.min;c++}})}
  items.push({t:'final',min:12});used+=12;

  items.forEach(i=>{i.w=Math.floor(cum/per)+1;cum+=i.min});

  save();return S.plan}
function nextItem(){if(!S.plan)return null;return S.plan.items.find(i=>!itemDone(i))||null}
function planPct(){if(!S.plan)return 0;const it=S.plan.items;return Math.round(it.filter(itemDone).length/it.length*100)}

  if(it.t==='prac')return{ic:'🎯',t:'Practica · '+MOD[it.mod].n,s:'Sesión de preguntas (aprobado 70 %)'};
  if(it.t==='sim'){const s=SIMS.find(x=>x.id===it.sim);return{ic:'🎬',t:'Simulación · '+s.t,s:MOD[it.mod].n}}
  if(it.t==='drill')return{ic:'🎧',t:'Escucha rápida · '+MOD[it.mod].n,s:'Acento americano a velocidad real'};
  if(it.t==='gr'){const l=GRM[it.les];return{ic:l.ic,t:'Gramática · '+l.n,s:l.es}}

function avgPrac(){const d=MODS.filter(m=>prog(m.id).prac>0);if(d.length<2)return 0;return Math.round(d.reduce((a,m)=>a+prog(m.id).prac,0)/d.length)}

  return h};

ACT.fastl=()=>{if(!S.set.voice){toast('🔇 Activa el sonido para la escucha');return}startSession(mixQs(allPh(),12,['listen']),{per:8,bonus:10,title:'Escucha rápida'})};
ACT.daily=()=>{const first=!S.seen['dc'+today()];startSession(mixQs(allPh(),10).concat(cultQs(2)),{per:8,bonus:first?30:10,title:'Mix del día',onDone:r=>{if(r.acc>=.6){S.seen['dc'+today()]=1;save()}}})};
ACT.weak=()=>{const ks=shuf(Object.keys(S.weak)).slice(0,12);const qs=ks.map(keyToQ).filter(Boolean);if(!qs.length){toast('No tienes frases débiles');return}startSession(qs,{per:8,title:'Frases débiles'})};
ACT.cult=()=>startSession(cultQs(8),{per:8,bonus:10,title:'Cultura práctica'});
V.practice=()=>{let h='<h1>Práctica</h1>'+srsCard();
  h+=row('🎧','Escucha rápida','Frases a velocidad real con acento americano','fastl');
  h+=row('⚡','Mix del día','10 preguntas de todo lo que llevas','daily');
  const nw=Object.keys(S.weak).length;h+=row('💪','Frases débiles',nw+' pendientes','weak');
  h+=row('🧭','Cultura práctica','Propinas, impuestos, 911… (8 preguntas)','cult');
  h+=row('🎬','Simulaciones','Conversaciones reales, '+SIMS.length+' escenas','go','sims');
  h+=row('📘','Curso B1 completo','18 lecciones de gramática, léxico y funciones','go','b1list');
  h+=row('🧱','Refuerzo A1-A2','6 mini-lecciones de gramática básica','go','grs');
  h+=row('🧪','Test de nivel','Repítelo cuando quieras','rtest');
  h+=row('🏁','Test final','Compara con tu nivel inicial'+(S.fin?' · último: '+S.fin.score+' %':''),'ftest');
  h+=row('📚','Temario y referencias','Qué cubre la app y con qué se ha contrastado','go','refs');
  return h};
V.sims=()=>{let h='<h1>🎬 Simulaciones</h1><p class="muted">Conversaciones con respuestas a elegir. Sin conexión.</p>';
  MODS.forEach(m=>{const l=simsOf(m.id);if(l.length){h+='<h2>'+m.ic+' '+esc(m.n)+'</h2>'+l.map(s=>row('🎬',esc(s.t),'Mejor: '+starsTxt(simBest(s.id))+' · '+LVN[s.lv]+'+','sim',s.id,simBest(s.id)?'done':'')).join('')}});return h};
V.b1list=()=>{let h='<h1>📘 Curso B1</h1><p class="muted">Gramática, léxico y funciones del nivel intermedio. Recomendado desde A2.</p>';
  h+=B1.map(l=>{const b=S.les[l.id]&&S.les[l.id].best;return row(l.ic,esc(l.n),esc(l.es)+(b!=null?' · mejor '+b+' %':''),'lesson',l.id,b>=70?'done':'')}).join('');return h};
V.grs=()=>{let h='<h1>🧱 Refuerzo A1-A2</h1><p class="muted">Gramática básica para viajar.</p>';
  h+=GR.map(l=>{const b=S.les[l.id]&&S.les[l.id].best;return row(l.ic,esc(l.n),esc(l.es)+(b!=null?' · mejor '+b+' %':''),'lesson',l.id,b>=70?'done':'')}).join('');return h};
/* ----- frases ----- */
const KEY30=[['surv',[0,1,2,3,5,6,10]],['air',[0,1,2,3]],['rest',[0,3,5,6,8]],['trans',[2,3,6,7]],['emer',[0,1,2,4,5]],['hotel',[0,3]],['shop',[0]],['soc',[0]],['money',[0]]];
const key30=()=>KEY30.reduce((a,x)=>a.concat(x[1].map(i=>MOD[x[0]].ph[i]).filter(Boolean)),[]);
let PF={mod:'all',q:''};
V.phrases=()=>{let h='<h1>Frases</h1><p class="muted">Tu libro de frases, sin conexión.</p><button class="btn block" data-a="go" data-v="card">📇 Tarjeta de 30 frases clave</button><input id="pq" class="fld" style="margin-top:12px" type="search" placeholder="Buscar en inglés o castellano" value="'+esc(PF.q)+'">';
  h+='<div class="pills"><button class="pill'+(PF.mod==='all'?' on':'')+'" data-a="pfm" data-v="all">Todas</button>'+MODS.map(m=>'<button class="pill'+(PF.mod===m.id?' on':'')+'" data-a="pfm" data-v="'+m.id+'">'+m.ic+'</button>').join('')+'</div><div id="pres">'+phList()+'</div>';return h};
function phList(){const q=norm(PF.q);let ps=PF.mod==='all'?MODS.reduce((a,m)=>a.concat(m.ph),[]):MOD[PF.mod].ph;if(q)ps=ps.filter(p=>norm(p.en).indexOf(q)>=0||norm(p.es).indexOf(q)>=0);
  if(!ps.length)return'<p class="muted">Sin resultados.</p>';
  return'<div class="card">'+ps.slice(0,80).map(p=>'<div class="hit">'+spk(p.en)+'<b>'+esc(p.en)+'</b><span class="es">'+esc(p.es)+'</span></div>').join('')+'</div>'+(ps.length>80?'<p class="muted">Mostrando 80 de '+ps.length+'. Afina la búsqueda.</p>':'')}
ACT.pfm=v=>{PF.mod=v;showCur()};
V.card=()=>{const ps=key30();return'<h1>📇 30 frases clave</h1><p class="muted">Pantallazo, copia o imprímela para llevarla en el viaje.</p><div class="card">'+ps.map(p=>'<div class="hit">'+spk(p.en)+'<b>'+esc(p.en)+'</b><span class="es">'+esc(p.es)+'</span></div>').join('')+'</div><div class="row"><button class="btn sm" data-a="printc">🖨️ Imprimir</button><button class="btn sec sm" data-a="copyc">📋 Copiar texto</button></div>'};
ACT.printc=()=>{try{window.print()}catch(e){}};
ACT.copyc=()=>{const t=key30().map(p=>p.en+' — '+p.es).join('\n');try{navigator.clipboard.writeText(t).then(()=>toast('Copiado'),()=>toast('No se pudo copiar'))}catch(e){toast('No se pudo copiar')}};
/* ----- yo: perfil, ajustes, copia de seguridad ----- */
V.me=()=>{const P=S.prof;let h='<h1>Yo</h1>';
  if(P)h+='<div class="card"><b>'+esc(P.name)+'</b><div class="muted">Nivel '+LVN[LV()]+(S.test&&S.test.skipped?' (estimado)':'')+' · '+(GOALS.filter(g=>g[0]===P.goal)[0]||['','','']) [2]+' · '+P.weeks+' semanas · '+P.mins+' min/día</div><div class="row" style="margin-top:8px"><button class="btn sec sm" data-a="onb">Editar datos</button><button class="btn sec sm" data-a="rtest">Rehacer test</button></div></div>';
  else h+='<button class="btn block" data-a="onb">Empezar</button>';
  if(S.test&&S.test.cat&&Object.keys(S.test.cat).length)h+='<div class="card"><b>Habilidades (test inicial)</b>'+catBars(S.test.cat)+'</div>';
  if(S.fin)h+='<div class="card"><b>Test final</b><p>'+LVN[S.fin.lv]+' · '+S.fin.score+' % ('+S.fin.date+')</p></div>';
  h+='<h2>Insignias</h2><div class="badges">'+BADGES.map(b=>'<span class="badge'+(S.badges[b[0]]?'':' off')+'" title="'+esc(b[3])+'">'+b[1]+' '+esc(b[2])+'</span>').join('')+'</div>';
  h+='<h2>Ajustes</h2><div class="card"><div class="setrow"><span class="ic">🔊</span><div class="grow"><b>Sonido</b><div class="muted">Voz en inglés del navegador</div></div><button class="btn sec sm" data-a="svoice">'+(S.set.voice?'Activado':'Silencio')+'</button></div>'+
   '<div class="setrow" style="margin-top:10px"><span class="ic">🐢</span><div class="grow"><b>Velocidad normal</b></div><div class="pills" style="margin:0">'+[[.8,'Lenta'],[.95,'Normal'],[1.1,'Rápida']].map(x=>'<button class="pill'+(S.set.rate===x[0]?' on':'')+'" data-a="srate" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div></div>'+
   '<div class="setrow" style="margin-top:10px"><span class="ic">🇺🇸</span><div class="grow"><b>Escucha a ritmo real</b><div class="muted">Acento americano más rápido en escucha y simulaciones</div></div><button class="btn sec sm" data-a="sfast">'+(S.set.fast?'Sí':'No')+'</button></div>'+
   '<div class="setrow" style="margin-top:10px"><span class="ic">🎙️</span><div class="grow"><b>Voz</b><select id="vsel" class="fld">'+voiceOpts()+'</select></div></div>'+
   '<div class="setrow" style="margin-top:10px"><span class="ic">🎨</span><div class="grow"><b>Tema</b></div><div class="pills" style="margin:0">'+[['auto','Auto'],['dark','Noche'],['light','Día']].map(x=>'<button class="pill'+(S.set.theme===x[0]?' on':'')+'" data-a="stheme" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div></div>'+
   '<div class="setrow" style="margin-top:10px"><span class="ic">🎯</span><div class="grow"><b>Objetivo diario</b></div><div class="pills" style="margin:0">'+[20,30,50].map(n=>'<button class="pill'+(S.goal===n?' on':'')+'" data-a="sgoal" data-v="'+n+'">'+n+' XP</button>').join('')+'</div></div></div>';
  h+='<h2>Mis datos</h2><div class="card"><p class="muted">Tu progreso solo está en este dispositivo. Haz copia para no perderlo.</p><div class="row"><button class="btn sec sm" data-a="bkcopy">📋 Copiar copia de seguridad</button><button class="btn sec sm" data-a="bkshow">Importar</button></div><div id="bkbox"></div><button class="btn sec sm" style="margin-top:10px" data-a="reset">🗑️ Borrar todo</button></div>';
  h+=row('📚','Temario y referencias','Cobertura B1, fuentes y licencias','go','refs')+'<a class="lrow" href="https://pekemtir.github.io/The-English-Way/" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><span class="ic">🌱</span><span class="grow"><b>The English Way</b><small>Curso gratuito A1 + A2 completo, por si quieres más base</small></span><span>↗</span></a>';
  return h};
function voiceOpts(){try{pickVoice()}catch(e){}const en=(VOICES||[]).filter(isEn);if(!en.length)return'<option>Voz del sistema</option>';
  return'<option value="">Automática (inglés de EE. UU.)</option>'+en.map(v=>'<option value="'+esc(v.name)+'"'+(S.set.voiceName===v.name?' selected':'')+'>'+esc(v.name)+' ('+esc(v.lang)+')</option>').join('')}
ACT.svoice=()=>{S.set.voice=!S.set.voice;if(!S.set.voice){try{speechSynthesis.cancel()}catch(e){}}save();showCur()};
ACT.srate=v=>{S.set.rate=+v;save();showCur();say('Hello! Welcome to Miami.')};
ACT.sfast=()=>{S.set.fast=!S.set.fast;save();showCur()};
ACT.stheme=v=>{S.set.theme=v;save();applyTheme();showCur()};
ACT.sgoal=v=>{S.goal=+v;save();showCur()};
ACT.bkcopy=()=>{const t=JSON.stringify(S);try{navigator.clipboard.writeText(t).then(()=>toast('Copia en el portapapeles'),()=>{ACT.bkshow()})}catch(e){ACT.bkshow()}};
ACT.bkshow=()=>{const b=$('#bkbox');if(b)b.innerHTML='<textarea id="bkt" class="fld" placeholder="Pega aquí tu copia de seguridad" rows="4">'+esc(JSON.stringify(S))+'</textarea><button class="btn sm" data-a="bkimp" style="margin-top:8px">Importar lo pegado</button>'};
ACT.bkimp=()=>{const t=$('#bkt');if(!t)return;try{const o=JSON.parse(t.value);if(!o||typeof o!=='object'||o.v!==1)throw 0;localStorage.setItem(KEY,JSON.stringify(o));load();applyTheme();toast('✅ Copia importada');go('home')}catch(e){toast('La copia no es válida')}};
ACT.reset=()=>{if(confirm('¿Borrar todo tu progreso y tus datos de este dispositivo?')){try{localStorage.removeItem(KEY)}catch(e){}load();applyTheme();NAV=[];go('home')}};
/* ===== TEMARIO Y REFERENCIAS ===== */
const COV=[['b01','Aspecto perfectivo; anterioridad y duración (for / since)'],['b02','Narrar en pasado; aspecto durativo y puntual'],['b03','Aspecto habitual; contraste pasado / presente'],['b04','Aspecto prospectivo; intención, predicción, promesa, oferta'],['b05','Relaciones lógicas: condición'],['b06','Hipótesis, deseo, consejo'],['b07','Modalidad: obligación, necesidad, prohibición, permiso'],['b08','Consejos, sugerencias, conjetura y probabilidad'],['b09','Estados y procesos; focalización (pasiva)'],['b10','Informar y transmitir mensajes (estilo indirecto)'],['b11','Cualidad y descripción (relativos)'],['b12','Relaciones lógicas: finalidad; patrones verbales'],['b13','Cantidad (grado), comparación y resultado'],['b14','Cantidad (número y cantidad)'],['b15','Causa, resultado, concesión, contraste, correlación'],['b16','Interrogación, cortesía y petición de información'],['b17','Léxico (viajes, compras, comunicación) y formación de palabras'],['b18','Funciones expresivas: opinión, acuerdo, decepción, preocupación, esperanza, disculpa, queja']];
V.refs=()=>{
  let h='<h1>📚 Temario y referencias</h1><div class="card"><p>El nivel <b>B1</b> de esta app (18 lecciones) se ha contrastado con el currículo básico del nivel Intermedio B1 del <b>Real Decreto 1041/2017</b> (escuelas oficiales de idiomas) y con las escalas B1 del <b>MCER</b>. Los módulos de viaje cubren los ámbitos léxicos de ese currículo que importan en Miami: viajes y vacaciones, alimentación y restauración, compras, salud, transporte, bienes y servicios, relaciones sociales y lengua y comunicación.</p></div>';
  h+='<h2>Cobertura del B1</h2><div class="tw"><table class="mini"><tr><th>Lección</th><th>Categoría del currículo</th></tr>'+COV.map(c=>'<tr><td>'+esc(B1M[c[0]].n)+'</td><td>'+esc(c[1])+'</td></tr>').join('')+'</table></div>';
  h+='<h2>Funciones del B1 que se practican</h2><div class="card"><p class="muted">Aconsejar y sugerir; pedir y ofrecer información, indicaciones y avisos; opinar, acordar y discrepar; formular hipótesis; expresar necesidad, deseo, intención, promesa, orden, permiso y prohibición; expresar decepción, disgusto, preocupación, esperanza, agradecimiento y disculpa; narrar, describir y relacionarse socialmente. Se trabajan en las lecciones B1 y en las simulaciones.</p></div>';
  h+='<h2>Lo que NO cubre</h2><div class="card"><p class="muted">No incluye producción escrita extensa, mediación formal, fonética guiada ni ensayo de examen oficial. No emite certificados ni sustituye un curso reglado. La programación concreta por cursos de una escuela oficial concreta no se ha replicado: solo se ha usado como referencia de contenidos.</p></div>';
  h+='<h2>Fuentes consultadas (solo para contrastar el temario, sin copiar textos)</h2><div class="card"><ul><li>Consejo de Europa · MCER, Volumen Complementario (2020): rm.coe.int/16809ea0d4</li><li>Real Decreto 1041/2017 (BOE-A-2017-15367), currículo básico del nivel Intermedio B1</li><li>Programación del Departamento de Inglés, EOI de Albacete, curso 2025-26 (competencias y funciones del B1). Consultada el 12-11-2026</li></ul></div>';
  h+='<h2>Información de viaje</h2><div class="card"><p class="muted">Los consejos sobre propinas, impuestos, número de emergencias o requisitos de entrada son orientativos y pueden cambiar. Comprueba siempre las webs oficiales (por ejemplo, para la autorización ESTA).</p></div>';
  h+='<h2>Licencias</h2><div class="card legal"><ul><li><b>Código</b>: MIT.</li><li><b>Contenidos del curso</b> (textos, ejercicios, simulaciones, frases): obra original, CC BY-NC 4.0.</li><li><b>Tipografías</b> Patrick Hand y Nunito (incrustadas): SIL Open Font License 1.1.</li><li>Proyecto independiente, <b>sin afiliación ni aval</b> de ninguna entidad oficial. No es un curso oficial ni emite certificados.</li><li>Privacidad: todo funciona en tu dispositivo. Sin cuentas, anuncios, cookies ni rastreo. El progreso se guarda en <code>localStorage</code>.</li></ul></div>';
  return h};
/* ===== ARRANQUE ===== */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=ACT[t.dataset.a];if(f){if(t.tagName!=='INPUT')e.preventDefault();f(t.dataset.v,t)}});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='onn'&&ONB)ONB.name=e.target.value;if(id==='pq'){PF.q=e.target.value;const r=$('#pres');if(r)r.innerHTML=phList()}});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='ond'&&ONB){ONB.date=e.target.value;showCur()}if(id==='vsel'){S.set.voiceName=e.target.value;save();pickVoice();say('Hello! Welcome to Miami.')}});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>go(t.dataset.v)));
$('#back').addEventListener('click',up);$('#brand').addEventListener('click',()=>go('home'));
applyTheme();show();
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js')}catch(e){}
})();
</script>
